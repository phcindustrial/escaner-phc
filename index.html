<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner Feria</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; margin: 0; }
        #reader { width: 100%; max-width: 500px; margin: 0 auto; border-radius: 8px; overflow: hidden; background: #000; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #status { margin-top: 20px; font-weight: bold; color: #333; padding: 15px; word-wrap: break-word; font-size: 1.1em; }
        .success { background-color: #d4edda; color: #155724; border-radius: 5px; }
        .error { background-color: #f8d7da; color: #721c24; border-radius: 5px; }
        
        /* Estilos para el formulario del producto */
        #formulario-producto { display: none; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
        #nombre-capturado { font-size: 1.2em; color: #155724; font-weight: bold; margin-bottom: 15px; }
        input[type="text"] { width: 90%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 5px; font-size: 1.1em; }
        button { background-color: #0056b3; color: white; padding: 12px 20px; border: none; border-radius: 5px; font-size: 1.1em; font-weight: bold; width: 100%; cursor: pointer; }
        button:active { background-color: #004494; }
    </style>
</head>
<body>

    <h2>Escáner de Contactos</h2>
    
    <!-- Contenedor de la Cámara -->
    <div id="reader"></div>
    
    <!-- Contenedor del Formulario (Oculto al inicio) -->
    <div id="formulario-producto">
        <div id="nombre-capturado"></div>
        <p>¿En qué producto está interesado?</p>
        <input type="text" id="input-producto" placeholder="Ej: Válvulas, Sensores..." autocomplete="off">
        <button onclick="enviarDatos()">Guardar y Continuar</button>
    </div>

    <div id="status">Iniciando cámara...</div>

    <script>
        // PEGA AQUÍ LA URL DE TU GOOGLE APPS SCRIPT
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwyG6ue0MJ5--uFhrw9Fr0D0w6yAG7OJf29WcDoeJqAukACg3y5OmlCPJ7jbcY_iqGZ/exec';

        const html5QrCode = new Html5Qrcode("reader");
        let contactoActual = {}; // Guardamos los datos temporalmente acá

        function onScanSuccess(decodedText, decodedResult) {
            html5QrCode.stop().then(() => {
                try {
                    const textoDecodificado = decodeURIComponent(escape(window.atob(decodedText)));
                    const partes = textoDecodificado.split('#|#');
                    
                    let telefonoLimpio = partes[4] ? partes[4].replace('+', '') : '';
                    
                    contactoActual = {
                        nombre: partes[0] + " " + partes[1],
                        empresa: partes[2],
                        telefono: "'" + telefonoLimpio, 
                        email: partes[5],
                        producto: "" // Se llena después
                    };

                    // Ocultamos la cámara y mostramos el formulario
                    document.getElementById('reader').style.display = 'none';
                    document.getElementById('formulario-producto').style.display = 'block';
                    
                    document.getElementById('nombre-capturado').innerText = `Contacto: ${contactoActual.nombre}`;
                    document.getElementById('input-producto').value = ''; // Limpiamos el cuadro
                    document.getElementById('input-producto').focus(); // Abrimos el teclado
                    
                    document.getElementById('status').innerText = 'Completá la información y guardá.';
                    document.getElementById('status').className = '';

                } catch (error) {
                    document.getElementById('status').innerText = 'Error: QR no válido.';
                    document.getElementById('status').className = 'error';
                    setTimeout(() => {
                        document.getElementById('status').className = '';
                        iniciarCamara();
                    }, 2000);
                }

            }).catch((err) => {
                console.log("Error al pausar la cámara", err);
            });
        }

        // Función que se activa al tocar el botón "Guardar y Continuar"
        function enviarDatos() {
            // Tomamos lo que escribiste en el cuadro de texto
            contactoActual.producto = document.getElementById('input-producto').value;

            document.getElementById('status').innerText = `Guardando ficha de ${contactoActual.nombre}...`;
            document.getElementById('status').className = '';

            // Enviamos todo a Google Sheets (modo rápido sin esperar)
            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors', 
                body: JSON.stringify(contactoActual),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            }).catch(err => {
                console.log("Error silencioso", err);
            });

            // Mostramos éxito
            document.getElementById('status').innerText = '¡Ficha guardada con éxito!';
            document.getElementById('status').className = 'success';

            // Volvemos a la cámara después de 1 segundo
            setTimeout(() => {
                document.getElementById('formulario-producto').style.display = 'none';
                document.getElementById('reader').style.display = 'block';
                document.getElementById('status').className = '';
                iniciarCamara();
            }, 1000);
        }

        function iniciarCamara() {
            document.getElementById('status').innerText = 'Buscando QR...';
            
            // Le pedimos a la librería que busque TODAS las cámaras del teléfono
            Html5Qrcode.getCameras().then(devices => {
                if (devices && devices.length) {
                    // Buscamos la PRIMERA cámara trasera (Suele ser la principal, esquivando la angular)
                    let idCamaraPrincipal = null;
                    for (let i = 0; i < devices.length; i++) {
                        if (devices[i].label.toLowerCase().includes("back") || devices[i].label.toLowerCase().includes("trasera")) {
                            idCamaraPrincipal = devices[i].id;
                            break; 
                        }
                    }

                    if (idCamaraPrincipal) {
                        // Arrancamos con el ID exacto de la cámara principal
                        html5QrCode.start(
                            idCamaraPrincipal,
                            { fps: 10, qrbox: { width: 250, height: 250 } },
                            onScanSuccess,
                            (errorMessage) => {}
                        ).catch(err => iniciarCamaraPlanB());
                    } else {
                        iniciarCamaraPlanB();
                    }
                } else {
                    iniciarCamaraPlanB();
                }
            }).catch(err => {
                iniciarCamaraPlanB();
            });
        }

        function iniciarCamaraPlanB() {
            // Si falla la búsqueda manual (pasa en iOS), usamos el entorno automático
            html5QrCode.start(
                { facingMode: { exact: "environment" } }, 
                { fps: 10, qrbox: { width: 250, height: 250 } },
                onScanSuccess,
                (errorMessage) => {}
            ).catch((err) => {
                html5QrCode.start(
                    { facingMode: "environment" }, 
                    { fps: 10, qrbox: { width: 250, height: 250 } },
                    onScanSuccess,
                    (errorMessage) => {}
                );
            });
        }

        // Arrancamos
        iniciarCamara();
    </script>

</body>
</html>
