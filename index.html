<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner Feria</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; margin: 0; }
        #reader { width: 100%; max-width: 500px; margin: 0 auto; border-radius: 8px; overflow: hidden; background: #000; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #status { margin-top: 20px; font-weight: bold; color: #333; padding: 15px; word-wrap: break-word; font-size: 1.1em; }
        .success { background-color: #d4edda; color: #155724; border-radius: 5px; }
        .error { background-color: #f8d7da; color: #721c24; border-radius: 5px; }
    </style>
</head>
<body>

    <h2>Escáner de Contactos</h2>
    <div id="reader"></div>
    <div id="status">Iniciando cámara trasera...</div>

    <script>
        // PEGA AQUÍ LA URL DE TU GOOGLE APPS SCRIPT
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwRord0rj7LmmwGMA7Q9a19ObGELW4-d-E_WDmx-u4gnKxk2RddDMA8PnwLV_dV3Dnq/exec';

        const html5QrCode = new Html5Qrcode("reader");

        function onScanSuccess(decodedText, decodedResult) {
            html5QrCode.stop().then(() => {
                try {
                    // Desencriptamos el texto
                    const textoDecodificado = decodeURIComponent(escape(window.atob(decodedText)));
                    const partes = textoDecodificado.split('#|#');
                    
                    // Limpiamos el teléfono quitándole el símbolo "+" si lo tiene (Posición 4)
                    let telefonoLimpio = partes[4] ? partes[4].replace('+', '') : '';
                    
                    // Armamos los datos (Posición 5 para email)
                    const data = {
                        nombre: partes[0] + " " + partes[1],
                        empresa: partes[2],
                        telefono: telefonoLimpio, 
                        email: partes[5]
                    };

                    // 1. Damos el aviso de éxito INMEDIATAMENTE en pantalla
                    document.getElementById('status').innerText = `¡Capturado: ${data.nombre}!`;
                    document.getElementById('status').className = 'success';

                    // 2. Reanudamos la cámara súper rápido (1.5 segundos) para seguir escaneando
                    setTimeout(() => {
                        document.getElementById('status').className = '';
                        iniciarCamara();
                    }, 1500);

                    // 3. Enviamos a Google de fondo SIN ESPERAR respuesta (mode: 'no-cors')
                    // Esto evita que la app se trabe o tire error si el internet de la feria está lento
                    fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors', 
                        body: JSON.stringify(data),
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                    }).catch(err => {
                        console.log("Error de red silencioso", err);
                    });

                } catch (error) {
                    document.getElementById('status').innerText = 'Error: QR no válido.';
                    document.getElementById('status').className = 'error';
                    setTimeout(() => {
                        document.getElementById('status').className = '';
                        iniciarCamara();
                    }, 2000);
                }

            }).catch((err) => {
                console.log("Error al pausar la cámara", err);
            });
        }

        function iniciarCamara() {
            document.getElementById('status').innerText = 'Buscando QR...';
            
            // Forzamos la cámara trasera
            html5QrCode.start(
                { facingMode: { exact: "environment" } }, 
                {
                    fps: 10,
                    qrbox: { width: 250, height: 250 }
                },
                onScanSuccess,
                (errorMessage) => {}
            ).catch((err) => {
                // Plan B si el modo estricto falla
                html5QrCode.start(
                    { facingMode: "environment" }, 
                    {
                        fps: 10,
                        qrbox: { width: 250, height: 250 }
                    },
                    onScanSuccess,
                    (errorMessage) => {}
                ).catch((err2) => {
                    document.getElementById('status').innerText = "Error al abrir la cámara: " + err2;
                });
            });
        }

        iniciarCamara();
    </script>

</body>
</html>
